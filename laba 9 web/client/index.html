<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сортировка массива</title>
    <link rel="stylesheet" href="/client/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Массив до сортировки</h1>
        <div class="min-value">Минимальный элемент: <span id="min-value"></span></div>
        <div id="original-array" class="array-table"></div>
        <button id="sort-btn">Отсортировать массив</button>
    </div>

    <div id="result-page" class="hidden">
        <div class="container">
            <h1>Массив после сортировки</h1>
            <div id="sorted-array" class="array-table"></div>
            <button id="back-btn">Вернуться назад</button>
        </div>
    </div>

    <script type="module" src="/client/script.js"></script>
</body>
</html>
